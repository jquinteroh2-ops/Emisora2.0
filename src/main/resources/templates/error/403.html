<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acceso Denegado (403)')}"></head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card text-center">
        <div class="card-body p-5">
            <div class="display-1 text-danger mb-3">
                <i class="bi bi-shield-slash-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2">Acceso Denegado (403)</h3>
            <p class="text-muted mb-4">
                Su usuario no cuenta con los permisos necesarios para acceder a esta sección del sistema.
            </p>
            <div class="d-grid gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Ir al Panel de Control
                </a>
                <a th:href="@{/emisoras}" class="btn btn-outline-secondary">
                    <i class="bi bi-broadcast me-1"></i> Ir al Catálogo de Emisoras
                </a>
            </div>
        </div>
        <div class="card-footer text-muted small bg-light">
            Seguridad &bull; Control de Acceso basado en Roles
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
