<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Página No Encontrada (404)')}"></head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card text-center">
        <div class="card-body p-5">
            <div class="display-1 text-warning mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-2" th:text="${tituloError != null ? tituloError : 'Página No Encontrada (404)'}">
                Página No Encontrada (404)
            </h3>
            <p class="text-muted mb-4" th:text="${mensajeError != null ? mensajeError : 'El recurso o página solicitada no existe o fue movida.'}">
                El recurso solicitado no fue encontrado en el servidor.
            </p>
            <div class="d-grid gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Ir al Panel de Control
                </a>
                <a th:href="@{/emisoras}" class="btn btn-outline-secondary">
                    <i class="bi bi-broadcast me-1"></i> Ir al Catálogo de Emisoras
                </a>
            </div>
        </div>
        <div class="card-footer text-muted small bg-light">
            Emisora 2.0 &bull; Manejo Amigable de Errores
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
