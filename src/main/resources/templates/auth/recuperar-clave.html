<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recuperar Contraseña')}"></head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-key-fill fs-1 text-warning d-block mb-2"></i>
            <h4 class="fw-bold mb-1">Recuperación de Contraseña</h4>
            <p class="small text-white-50 mb-0">Emisora 2.0</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <p class="text-muted small mb-4">
                Ingrese la dirección de correo electrónico vinculada a su cuenta institucional o registrada.
                Le enviaremos un enlace seguro para restablecer su clave.
            </p>

            <!-- Mensajes de Alerta -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/recuperar-clave}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small fw-semibold">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="ejemplo@unicartagena.edu.co" required autofocus>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                        <i class="bi bi-send-fill me-1"></i> Enviar Enlace de Recuperación
                    </button>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Regresar al inicio de sesión
                    </a>
                </div>
            </form>
        </div>

        <div class="card-footer text-center bg-light py-2 text-muted small border-top">
            Desarrollo Web | Unidad 2 &mdash; Ejercicio 25
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
