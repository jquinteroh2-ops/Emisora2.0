<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Restablecer Contraseña')}"></head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-shield-lock-fill fs-1 text-warning d-block mb-2"></i>
            <h4 class="fw-bold mb-1">Nueva Contraseña</h4>
            <p class="small text-white-50 mb-0">Emisora 2.0</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <p class="text-muted small mb-3">
                Hola, <strong th:text="${usuarioNombre}">Usuario</strong>. Ingrese su nueva contraseña para actualizar el acceso a su cuenta.
            </p>

            <!-- Mensajes de Alerta -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form th:action="@{/restablecer-clave}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="mb-3">
                    <label for="nuevaClave" class="form-label text-secondary small fw-semibold">Nueva Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="nuevaClave" name="nuevaClave"
                               placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmarClave" class="form-label text-secondary small fw-semibold">Confirmar Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmarClave" name="confirmarClave"
                               placeholder="Repita la nueva contraseña" minlength="6" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Guardar Nueva Contraseña
                    </button>
                </div>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="text-decoration-none small text-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar y volver al login
                    </a>
                </div>
            </form>
        </div>

        <div class="card-footer text-center bg-light py-2 text-muted small border-top">
            Desarrollo Web | Unidad 2 &mdash; Ejercicio 25
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
