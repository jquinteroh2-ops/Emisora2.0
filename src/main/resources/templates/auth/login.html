<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar Sesión')}"></head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="auth-header">
            <i class="bi bi-broadcast fs-1 text-warning d-block mb-2"></i>
            <h3 class="fw-bold mb-1">Emisora 2.0</h3>
            <p class="small text-white-50 mb-0">Sistema de Gestión de Emisoras Radiales</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <h5 class="card-title text-center text-secondary mb-4">Ingreso al Sistema</h5>

            <!-- Mensajes de Alerta -->
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Formulario Spring Security -->
            <form th:action="@{/login}" method="post" class="needs-validation">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-semibold">Usuario o Correo Institucional</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="U001 o correo..." required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label text-secondary small fw-semibold">Contraseña</label>
                        <a th:href="@{/recuperar-clave}" class="small text-decoration-none text-primary">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                    </button>
                </div>
            </form>
        </div>

        <div class="card-footer text-center bg-light py-2 text-muted small border-top">
            Desarrollo Web | Unidad 2 &mdash; Ejercicio 25
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
