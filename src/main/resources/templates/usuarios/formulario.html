<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${esEdicion ? 'Editar Usuario' : 'Nuevo Usuario'})}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('usuarios')}"></nav>

<main class="container py-4">

    <!-- Mensajes de Alerta -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold text-dark mb-0 d-flex align-items-center gap-2">
                        <i class="bi bi-person-badge text-primary"></i>
                        <span th:text="${esEdicion ? 'Editar Usuario: ' + usuario.nombre : 'Registrar Nuevo Usuario'}">Formulario de Usuario</span>
                    </h5>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Volver
                    </a>
                </div>

                <div class="card-body p-4">
                    <form th:action="${esEdicion} ? @{/usuarios/editar/{id}(id=${usuario.id})} : @{/usuarios/nuevo}"
                          th:object="${usuario}" method="post">

                        <input type="hidden" th:if="${esEdicion}" th:field="*{id}">

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small">Código o Nombre de Usuario <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{username}" id="username" placeholder="Ej: U006 o juan.perez"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            <span class="form-text small text-muted">Identificador único utilizado para iniciar sesión.</span>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold small">Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{nombre}" id="nombre" placeholder="Ej: Juan Pérez Morales"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small">Correo Electrónico <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="juan.perez@unicartagena.edu.co"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            <span class="form-text small text-muted">Requerido para la recuperación de contraseña por correo.</span>
                        </div>

                        <div class="mb-3">
                            <label for="rol" class="form-label fw-semibold small">Rol en el Sistema <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{rol}" id="rol" required>
                                <option value="ADMIN">ADMINISTRADOR (Gestión total: usuarios, emisoras y reportes)</option>
                                <option value="OPERADOR">OPERADOR (Gestión de emisoras y reportes)</option>
                                <option value="CONSULTA">CONSULTA (Visualización y reportes parametrizados)</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="passwordRaw" class="form-label fw-semibold small">
                                Contraseña
                                <span th:if="${!esEdicion}" class="text-danger">*</span>
                                <span th:if="${esEdicion}" class="text-muted fw-normal">(dejar en blanco para conservar la actual)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="passwordRaw" name="passwordRaw"
                                       placeholder="Mínimo 6 caracteres" minlength="6" th:required="${!esEdicion}">
                            </div>
                            <span class="form-text small text-muted">Las contraseñas son protegidas con hash seguro BCrypt.</span>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary shadow-sm">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${esEdicion ? 'Actualizar Usuario' : 'Crear Usuario'}">Guardar</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
