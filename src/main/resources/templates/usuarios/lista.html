<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Administración de Usuarios')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('usuarios')}"></nav>

<main class="container-fluid px-lg-4 py-4">

    <!-- Mensajes de Alerta -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <!-- Barra Superior -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body p-3 p-md-4">
            <div class="row g-3 align-items-center justify-content-between">
                <div class="col-12 col-md-5">
                    <h4 class="fw-bold text-dark mb-1 d-flex align-items-center gap-2">
                        <i class="bi bi-people-fill text-primary"></i>
                        <span>Administración de Usuarios</span>
                    </h4>
                    <p class="text-muted small mb-0">
                        Total de cuentas registradas: <strong th:text="${#lists.size(usuarios)}">0</strong>
                    </p>
                </div>

                <div class="col-12 col-md-7 d-flex flex-column flex-sm-row gap-2 justify-content-md-end align-items-sm-center">
                    <form th:action="@{/usuarios}" method="get" class="d-flex gap-2 w-100 w-sm-auto">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="buscar" th:value="${buscar}" class="form-control"
                                   placeholder="Código, nombre o correo...">
                            <button class="btn btn-primary" type="submit">Buscar</button>
                            <a th:if="${buscar != null and !buscar.isEmpty()}" th:href="@{/usuarios}" class="btn btn-outline-secondary" title="Limpiar filtro">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </div>
                    </form>

                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary btn-sm d-flex align-items-center gap-1 text-nowrap shadow-sm">
                        <i class="bi bi-person-plus-fill"></i> Crear Usuario
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de Usuarios -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-custom align-middle mb-0">
                    <thead>
                        <tr>
                            <th>Código / Usuario</th>
                            <th>Nombre Completo</th>
                            <th>Correo Electrónico</th>
                            <th>Rol</th>
                            <th>Fecha de Registro</th>
                            <th class="text-end pe-3">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td>
                                <span class="badge bg-secondary font-monospace" th:text="${usuario.username}">U001</span>
                            </td>
                            <td>
                                <strong class="text-dark" th:text="${usuario.nombre}">José Quintero</strong>
                            </td>
                            <td>
                                <span class="text-muted" th:text="${usuario.email}">jquinteroh2@unicartagena.edu.co</span>
                            </td>
                            <td>
                                <span th:if="${usuario.rol == 'ADMIN'}" class="badge badge-role-admin">ADMINISTRADOR</span>
                                <span th:if="${usuario.rol == 'OPERADOR'}" class="badge badge-role-operador">OPERADOR</span>
                                <span th:if="${usuario.rol == 'CONSULTA'}" class="badge badge-role-consulta">CONSULTA</span>
                            </td>
                            <td class="small text-muted" th:text="${usuario.createdAt != null ? #temporals.format(usuario.createdAt, 'dd/MM/yyyy HH:mm') : 'N/A'}">
                                01/08/2026 08:00
                            </td>
                            <td class="text-end pe-3">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/usuarios/ver/{id}(id=${usuario.id})}" class="btn btn-outline-info" title="Ver detalles">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-outline-warning" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('¿Confirma la eliminación del usuario ' + this.getAttribute('data-nombre') + '?');"
                                          th:data-nombre="${usuario.nombre}">
                                        <button type="submit" class="btn btn-outline-danger" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-people fs-1 d-block mb-2 text-secondary"></i>
                                No se encontraron usuarios registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
