# =====================================================================
# Perfil MySQL: MySQL local o TiDB Cloud (compatible con MySQL) en el despliegue
# Activar con: --spring.profiles.active=mysql  (o SPRING_PROFILES_ACTIVE=mysql)
# Crear antes la base con db/01_schema.sql y db/02_data.sql
#
# TiDB Cloud exige conexión cifrada, por ejemplo:
#   DB_URL=jdbc:mysql://HOST:4000/emisora2_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emisora2_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pocas conexiones: el plan gratuito de Render tiene 512 MB y TiDB Starter limita conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La consola H2 solo tiene sentido con la base embebida
spring.h2.console.enabled=false
