# =====================================================================
# Perfil MySQL: producción o pruebas locales con servidor MySQL
# Activar con: --spring.profiles.active=mysql
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emisora_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
