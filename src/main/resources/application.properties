# =====================================================================
# Configuración Principal de la Aplicación - Emisora 2.0 (Spring Boot MVC)
# =====================================================================

spring.application.name=emisora

# Puerto del servidor web embebido (permite variable de entorno PORT para la nube)
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Detrás del proxy HTTPS de Render: respeta X-Forwarded-Proto/Host en redirecciones y enlaces
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------
# Base de Datos por defecto (H2 en memoria con modo MySQL compatible)
# Permite levantar la aplicación inmediatamente sin preinstalar servicios
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:emisora_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola de administración H2 (accesible en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------------
# Configuración JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# Motor de Plantillas Thymeleaf
# ---------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------
# Configuración de Correo Electrónico (recuperación de clave)
# 1. BREVO_API_KEY: envío por la API HTTPS de Brevo (usado en Render, que bloquea SMTP).
# 2. MAIL_USERNAME / MAIL_PASSWORD: envío por SMTP con JavaMailSender.
# Sin ninguno de los dos, el enlace de recuperación se escribe en la consola.
# ---------------------------------------------------------------------
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Emisora 2.0}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# URL base para los enlaces de recuperación de contraseña
# En Render se toma RENDER_EXTERNAL_URL (variable que Render define sola) si no se fija APP_BASE_URL
app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}

# Minutos de vigencia del token de recuperación
app.reset-token-expiration-minutes=30
