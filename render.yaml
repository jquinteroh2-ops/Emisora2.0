# Servicio web gratuito en Render (Docker). Base de datos: TiDB Cloud Starter (compatible con MySQL).
# Las variables con "sync: false" se escriben en el panel de Render; nunca se suben a GitHub.
services:
  - type: web
    name: emisora-2-0
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
